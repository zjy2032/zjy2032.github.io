<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zjy2032 的编程空间</title>
    <style>
        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* 防止粒子飞出滚动条 */
        }
        
        /* 背景画布 */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* 放在最底层 */
        }

        .container {
            text-align: left;
            background: rgba(22, 27, 34, 0.85); /* 半透明背景，透出粒子 */
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(88, 166, 255, 0.3);
            border: 1px solid #30363d;
            max-width: 600px;
            width: 90%;
            z-index: 1;
            backdrop-filter: blur(5px);
        }
        h1 { color: #fff; margin-bottom: 10px; }
        .highlight { color: #3fb950; }
        
        /* 打字机光标 */
        .cursor { 
            animation: blink 1s step-end infinite; 
            color: #3fb950;
        }
        @keyframes blink { 50% { opacity: 0; } }
        
        a { color: #58a6ff; text-decoration: none; border-bottom: 1px dashed #58a6ff; transition: all 0.3s; }
        a:hover { color: #3fb950; border-bottom: 1px solid #3fb950; }
        .info { color: #8b949e; margin-top: 20px; line-height: 1.6; }
        
        /* 底部时间 */
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #484f58;
            border-top: 1px solid #30363d;
            padding-top: 10px;
        }
    </style>
</head>
<body>

<!-- 粒子特效画布 -->
<canvas id="canvas-bg"></canvas>

<div class="container">
    <h1>Welcome to <span class="highlight">zjy2032</span>'s Space</h1>
    
    <!-- 打字机效果区域 -->
    <p>> <span id="typing-text"></span><span class="cursor">_</span></p>
    
    <div class="info">
        <p>[+] 专属域名：<a href="http://zjy2032.github.io" target="_blank">zjy2032.github.io</a></p>
        <p>[+] GitHub主页：<a href="https://github.com/zjy2032" target="_blank">github.com/zjy2032</a></p>
        <p>[+] 当前状态：正在学习算法与数据结构，准备AK全场！</p>
    </div>
    
    <div class="footer">
        [System Time] <span id="clock"></span> | [Status] Online
    </div>
</div>

<script>
    // ===== 1. 打字机效果 =====
    const text = "System initialized... 这是我的个人编程主页。";
    const typingElement = document.getElementById("typing-text");
    let index = 0;
    
    function typeWriter() {
        if (index < text.length) {
            typingElement.innerHTML += text.charAt(index);
            index++;
            setTimeout(typeWriter, 100); // 100毫秒打一个字
        }
    }
    window.onload = typeWriter; // 页面加载完毕后开始打字

    // ===== 2. 底部时钟 =====
    function updateClock() {
        const now = new Date();
        const timeString = now.toLocaleString('zh-CN', { hour12: false });
        document.getElementById("clock").innerText = timeString;
    }
    setInterval(updateClock, 1000); // 每秒更新一次
    updateClock();

    // ===== 3. 背景粒子特效 =====
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particlesArray = [];
    let mouse = { x: null, y: null, radius: 150 };

    window.addEventListener('mousemove', function(event) {
        mouse.x = event.x;
        mouse.y = event.y;
    });

    class Particle {
        constructor(x, y, directionX, directionY, size, color) {
            this.x = x;
            this.y = y;
            this.directionX = directionX;
            this.directionY = directionY;
            this.size = size;
            this.color = color;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
            ctx.fillStyle = '#58a6ff';
            ctx.fill();
        }
        update() {
            if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;
            if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;
            
            let dx = mouse.x - this.x;
            let dy = mouse.y - this.y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < mouse.radius + this.size) {
                if (mouse.x < this.x && this.x < canvas.width - this.size * 10) this.x += 5;
                if (mouse.x > this.x && this.x > this.size * 10) this.x -= 5;
                if (mouse.y < this.y && this.y < canvas.height - this.size * 10) this.y += 5;
                if (mouse.y > this.y && this.y > this.size * 10) this.y -= 5;
            }
            
            this.x += this.directionX;
            this.y += this.directionY;
            this.draw();
        }
    }

    function init() {
        particlesArray = [];
        let numberOfParticles = (canvas.height * canvas.width) / 15000;
        for (let i = 0; i < numberOfParticles; i++) {
            let size = (Math.random() * 2) + 1;
            let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
            let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
            let directionX = (Math.random() * 1) - 0.5;
            let directionY = (Math.random() * 1) - 0.5;
            particlesArray.push(new Particle(x, y, directionX, directionY, size, '#58a6ff'));
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        for (let i = 0; i < particlesArray.length; i++) {
            particlesArray[i].update();
        }
        for (let a = 0; a < particlesArray.length; a++) {
            for (let b = a; b < particlesArray.length; b++) {
                let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x))
                + ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                if (distance < (canvas.width / 10) * (canvas.height / 10)) {
                    let opacityValue = 1 - (distance / 20000);
                    ctx.strokeStyle = 'rgba(88, 166, 255,' + opacityValue + ')';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                    ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                    ctx.stroke();
                }
            }
        }
    }
    
    init();
    animate();

    window.addEventListener('resize', function() {
        canvas.width = innerWidth;
        canvas.height = innerHeight;
        init();
    });
</script>

</body>
</html>
